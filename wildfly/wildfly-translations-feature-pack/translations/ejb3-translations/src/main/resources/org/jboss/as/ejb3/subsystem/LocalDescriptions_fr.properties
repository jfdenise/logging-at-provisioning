ejb3=La configuration du sous-syst\u00E8me ejb3.
ejb3.add=Ajoute le sous-syst\u00E8ne ejb3.
ejb3.enable-statistics=Si d\u00E9fini \u00E0 true, activera la collecte de statistiques d'invocation. Obsol\u00E8te au profit de "statistics-enabled"
ejb3.enable-statistics.deprecated=Si d\u00E9fini \u00E0 true, activera la collecte de statistiques d'invocation. Obsol\u00E8te au profit de "statistics-enabled"
ejb3.statistics-enabled=Si d\u00E9fini \u00E0 true, activera la collecte de statistiques d'invocation.
ejb3.remove=Supprime le sous-syst\u00E8me ejb3.

ejb3.lite=Indique si le conteneur ejb3 doit uniquement fournir le profil "LITE" de la sp\u00E9cification. Cette valeur ne doit pas \u00EAtre false quand on utilise la distro "everything".
ejb3.default-clustered-sfsb-cache=Nom du cache de bean stateful par d\u00E9faut, qui sera applicable \u00E0 tous les Jakarta Enterprise Beans stateful clusteris\u00E9s, \u00E0 moins qu'il ait \u00E9t\u00E9 remplac\u00E9 au niveau du d\u00E9ploiement ou du bean
ejb3.default-clustered-sfsb-cache.deprecated=Non pris en charge par les versions de serveur actuelles ; il n'est autoris\u00E9 que dans les profils de domaine g\u00E9r\u00E9s des serveurs ex\u00E9cutant d'anciennes versions.
ejb3.default-sfsb-passivation-disabled-cache=Nom du cache de beans avec \u00E9tat par d\u00E9faut, applicable \u00E0 tous les beans Jakarta Enterprise avec \u00E9tat dont la passivation est d\u00E9sactiv\u00E9e. Chaque d\u00E9ploiement ou chaque Bean Jakarta Enterprise peut \u00E9ventuellement remplacer ce nom de cache.
ejb3.default-mdb-instance-pool=Nom du pool d'instance MDB par d\u00E9faut, qui sera applicable \u00E0 tous les MDB, \u00E0 moins qu'il ait \u00E9t\u00E9 remplac\u00E9 au niveau d\u00E9ploiement ou bean
ejb3.default-entity-bean-instance-pool=Nom du cache de l'entit\u00E9 de bean par d\u00E9faut, qui sera applicable \u00E0 toutes les entit\u00E9s bean, \u00E0 moins qu'il ait \u00E9t\u00E9 remplac\u00E9 au niveau du d\u00E9ploiement ou du bean
ejb3.default-entity-bean-instance-pool.deprecated=Non pris en charge par les versions de serveur actuelles ; il n'est autoris\u00E9 que dans les profils de domaine g\u00E9r\u00E9s des serveurs ex\u00E9cutant d'anciennes versions.
ejb3.default-entity-bean-optimistic-locking=Si d\u00E9fini \u00E0 true, les entit\u00E9s beans utiliseront le verrouillage optimiste par d\u00E9faut
ejb3.default-entity-bean-optimistic-locking.deprecated=Non pris en charge par les versions de serveur actuelles ; il n'est autoris\u00E9 que dans les profils de domaine g\u00E9r\u00E9s des serveurs ex\u00E9cutant d'anciennes versions.
ejb3.default-resource-adapter-name=Nom de l'adaptateur de ressources par d\u00E9faut qui sera utilis\u00E9 par les MDB, \u00E0 moins qu'il soit remplac\u00E9 au niveau d\u00E9ploiement ou bean
ejb3.default-sfsb-cache=Nom du cache de bean stateful par d\u00E9faut, qui sera applicable \u00E0 tous les Jakarta Enterprise Beans stateful, \u00E0 moins qu'il ait \u00E9t\u00E9 remplac\u00E9 au niveau du d\u00E9ploiement ou du bean
ejb3.default-slsb-instance-pool=Nom du pool d'instances de bean stateless par d\u00E9faut, qui sera applicable \u00E0 toutes les entit\u00E9s Jakarta Enterprise Beans, \u00E0 moins qu'il ait \u00E9t\u00E9 remplac\u00E9 au niveau du d\u00E9ploiement ou du bean
ejb3.default-stateful-bean-access-timeout=Le d\u00E9lai d'attente d'acc\u00E8s par d\u00E9faut pour les beans stateful
ejb3.default-stateful-bean-session-timeout=Le d\u00E9lai d\u2019attente de session par d\u00E9faut pour les stateful beans. La modification de cet attribut prend effet imm\u00E9diatement pour les d\u00E9ploiements ult\u00E9rieurs ; pour les Jakarta Enterprise Beans d\u00E9j\u00E0 d\u00E9ploy\u00E9s, un red\u00E9ploiement est n\u00E9cessaire pour utiliser la nouvelle valeur.
ejb3.default-singleton-bean-access-timeout=Le d\u00E9lai d'attente d'acc\u00E8s par d\u00E9faut pour les beans singleton
ejb3.in-vm-remote-interface-invocation-pass-by-value=Si la valeur est d\u00E9finie sur \u00AB\u00A0false\u00A0\u00BB, les param\u00E8tres des invocations sur l'interface distante d'un Jakarta Enterprise Beans seront transmis par r\u00E9f\u00E9rence. Sinon, les param\u00E8tres seront transmis par valeur.
ejb3.default-distinct-name=Le nom distinct par d\u00E9faut qui est appliqu\u00E9 \u00E0 chaque Jakarta Enterprise Beans d\u00E9ploy\u00E9 sur ce serveur
ejb3.default-security-domain=Le domaine de s\u00E9curit\u00E9 par d\u00E9faut qui sera utilis\u00E9 pour les Jakarta Enterprise Beans si le bean n'en sp\u00E9cifie pas un explicitement
ejb3.default-missing-method-permissions-deny-access=Si cette option est d\u00E9finie sur true, les m\u00E9thodes sur Jakarta Enterprise Beans avec un domaine de s\u00E9curit\u00E9 sp\u00E9cifi\u00E9 ou avec d'autres m\u00E9thodes avec des m\u00E9tadonn\u00E9es de s\u00E9curit\u00E9 auront un @DenyAll implicite, sauf si d'autres m\u00E9tadonn\u00E9es de s\u00E9curit\u00E9 sont pr\u00E9sentes.
ejb3.disable-default-ejb-permissions=Cet attribut d\u00E9pr\u00E9ci\u00E9 n'a aucun effet, et sera supprim\u00E9 dans une future version ; il ne sera plus d\u00E9fini \u00E0 la valeur \u00AB false\u00A0\u00BB
ejb3.disable-default-ejb-permissions.deprecated=L'ajout de permissions par d\u00E9faut aux d\u00E9ploiements Jakarta Enterprise Beans n'est plus pris en charge et cet attribut de configuration sera supprim\u00E9 dans une future version
ejb3.enable-graceful-txn-shutdown=L'activation de l'arr\u00EAt progressif de txn fait en sorte que le serveur attende la fin des transactions distantes actives li\u00E9es \u00E0 Jakarta Enterprise Beans avant de se suspendre. Pour cette raison, si le serveur fonctionne sur un cluster, le n\u0153ud du cluster suspendu peut recevoir des requ\u00EAtes Jakarta Enterprise Beans jusqu'\u00E0 ce que toutes les transactions distantes actives soient termin\u00E9es. Pour \u00E9viter ce comportement, omettez cette balise. Cet attribut n'a aucun effet sur les transactions locales li\u00E9es \u00E0 Jakarta Enterprise Beans.
ejb3.log-system-exceptions=Si cela est vrai, toutes les exceptions syst\u00E8me (et non applicatives) de Jakarta Enterprise Beans seront journalis\u00E9es. La sp\u00E9cification Jakarta Enterprise Beans impose ce comportement, mais il est d\u00E9conseill\u00E9, car il entra\u00EEne souvent une double journalisation des exceptions (une fois par Jakarta Enterprise Beans et une fois par le code appelant).
ejb3.allow-ejb-name-regex=Si sur true, alors, des expressions standards peuvent \u00EAtre utilis\u00E9es pour les liaisons d'intercepteurs afin de permettre aux intercepteurs d'\u00EAtre mapp\u00E9s \u00E0 tous les beans qui correspondent \u00E0 l'expression standard
ejb3.server-interceptors=D\u00E9finitions des intercepteurs de serveur.
ejb3.server-interceptors.class=Classe impl\u00E9mentant l'intercepteur de serveur.
ejb3.server-interceptors.module=Module dans lequel l'intercepteur du serveur est d\u00E9fini.
ejb3.client-interceptors=D\u00E9finitions des intercepteurs de serveur.
ejb3.client-interceptors.class=Classe impl\u00E9mentant l'intercepteur de serveur.
ejb3.client-interceptors.module=Module dans lequel l'intercepteur du serveur est d\u00E9fini.

service=Services configurables de mani\u00E8re centralis\u00E9e qui font partie du sous-syst\u00E8me Enterprise Beans 3.

timer-service=Le service de minuterie de Jakarta Enterprise Beans
timer-service.add=Ajoute le service du minuteur
timer-service.remove=Supprime le service du minuteur
timer-service.thread-pool-name=Le nom du pool de threads utilis\u00E9s pour ex\u00E9cuter les invocations de service
timer-service.default-data-store=Store de stockage utilis\u00E9 par d\u00E9faut pour les minuteurs persistants
timer-service.default-persistent-timer-management=La gestion par d\u00E9faut des minuteries \u00E0 utiliser pour les minuteries persistantes.
timer-service.default-transient-timer-management=La gestion par d\u00E9faut des minuteries \u00E0 utiliser pour les minuteries transitoires.

file-data-store=Store de fichiers local de la JVM qui stocke les minuteries persistantes de Jakarta Enterprise Beans
file-data-store.add=Ajoute un store de donn\u00E9es de fichier
file-data-store.remove="Supprime un store de donn\u00E9es de fichier
file-data-store.path=Le r\u00E9pertoire qui stocke les informations de minuterie persistantes
file-data-store.relative-to=Le chemin relatif utilis\u00E9 pour r\u00E9soudre l'emplacement du store de donn\u00E9es de minuterie


database-data-store=Store bas\u00E9 sur une base de donn\u00E9es pour les minuteries persistantes de Jakarta Enterprise Beans.
database-data-store.add=Ajoute un store de bases de donn\u00E9es
database-data-store.remove=Supprime un store de base de donn\u00E9es
database-data-store.datasource-jndi-name=La source de donn\u00E9es utilis\u00E9e pour persister les minuteries
database-data-store.database=Le type de base de donn\u00E9es qui est utilis\u00E9. Le SQL peut \u00EAtre personnalis\u00E9 par type de base de donn\u00E9es. Les valeurs courantes sont : postgresql, mysql, mariadb, db2, hsql, h2, oracle, mssql et sybase.
database-data-store.partition=Le nom de partition. Doit \u00EAtre d\u00E9fini \u00E0 une valeur diff\u00E9rente pour chaque noeud partageant une base de donn\u00E9es afin d'emp\u00EAcher que la m\u00EAme minuterie soit charg\u00E9e par des noeud multiples.
database-data-store.refresh-interval=Intervalle entre la r\u00E9actualisation de la minuterie et la base de donn\u00E9es sous-jacente. Une valeur moindre signifie que les minuteries sont plus souvent pr\u00E9lev\u00E9es, mais cela ajoute une charge de travail sur la base de donn\u00E9es.
database-data-store.allow-execution=Indique si ce noeud est autoris\u00E9 \u00E0 ex\u00E9cuter les minuteurs. Si la valeur est false, les minuteurs seront ajout\u00E9s \u00E0 la base de donn\u00E9es, et un autre noeud risque de les ex\u00E9cuter. Notez que selon votre intervalle de r\u00E9actualisation, si vous ajoutez des minuteurs avec un petit d\u00E9lai d'expiration, ils n'ex\u00E9cuteront pas tant qu'un autre noeud n'a pas \u00E9t\u00E9 r\u00E9actualis\u00E9.

timer=Minuterie actuelle en cours d'ex\u00E9cution pour Jakarta Enterprise Beans
timer.info=Information s\u00E9rialisable associ\u00E9e \u00E0 la minuterie.
timer.primary-key=Cl\u00E9 primaire de l'instance de Jakarta Enterprise Beans qui a lanc\u00E9 la minuterie.
timer.primary-key.deprecated=D\u00E9pr\u00E9ci\u00E9 car les entity beans ne sont plus pris en charge.
timer.time-remaining=Le nombre de millisecondes qui passeront avant la prochaine expiration de la minuterie, ou "undefined" si la minuterie n'a pas de d\u00E9lais d'expiration \u00E0 venir, a expir\u00E9, ou a \u00E9t\u00E9 annul\u00E9e.
timer.next-timeout=Le moment (en ms \u00E0 partir de l'\u00E9poque) avant la prochaine expiration de la minuterie pr\u00E9vue, ou "undefined" si la minuterie n'a pas de d\u00E9lais d'expiration \u00E0 venir, a expir\u00E9, ou a \u00E9t\u00E9 annul\u00E9e.
timer.calendar-timer=Indique si cette minuterie est bas\u00E9e calendrier, ou "undefined" si la minuterie a expir\u00E9 ou a \u00E9t\u00E9 annul\u00E9e.
timer.persistent=Indique si cette minuterie a des s\u00E9mantiques persistantes ou "undefined" si la minuterie a expir\u00E9 ou a \u00E9t\u00E9 annul\u00E9e.
timer.active=Indique si cette minuterie est active ou a \u00E9t\u00E9 suspendue.
timer.schedule=L'expression de planification correspondant \u00E0 la minuterie ou "undefined" si la minuterie n'a pas \u00E9t\u00E9 cr\u00E9\u00E9e par une expression de planification, a expir\u00E9 ou a \u00E9t\u00E9 annul\u00E9e.
timer.schedule.year=Une ann\u00E9e particuli\u00E8re.
timer.schedule.month=Un ou plusieurs mois dans une ann\u00E9e.
timer.schedule.day-of-month=Un ou plusieurs jours dans un mois.
timer.schedule.day-of-week=Un ou plusieurs jours dans une semaine.
timer.schedule.hour=Une ou plusieurs heures dans un jour.
timer.schedule.minute=Une ou plusieurs minutes dans une heure.
timer.schedule.second=Une ou plusieurs secondes dans une minute.
timer.schedule.timezone=Un r\u00E9seau horaire (non par d\u00E9faut) dans lequel les sp\u00E9cificit\u00E9s de la programation doivent \u00EAtre \u00E9valu\u00E9es.
timer.schedule.start=La date de d\u00E9marrage de la minuterie, en ms \u00E0 partir de l'\u00E9poque.
timer.schedule.end=La date de fin de la minuterie, en ms \u00E0 partir de l'\u00E9poque.

timer.suspend=Suspend la minuterie. Aucun d\u00E9lai d'expiration n'aura lieu apr\u00E8s que cette op\u00E9ration aura eu lieu. Pour r\u00E9animer la minuterie, l'op\u00E9ration 'activate' est pr\u00E9sente.
timer.activate=Active la minuterie apr\u00E8s qu'elle ait \u00E9t\u00E9 suspendue.
timer.cancel=Supprime la minuterie et la supprime du conteneur.
timer.trigger=D\u00E9clenche la m\u00E9thode de temps mort de la minuterie pr\u00E9matur\u00E9ment.

strict-max-bean-instance-pool=Un pool d'instances bean ayant une limite sup\u00E9rieure stricte
strict-max-bean-instance-pool.add=Ajoute un pool d'instances de bean dot\u00E9 d'une limite d'instances de beans stricte
strict-max-bean-instance-pool.remove=Supprime un pool d'instances de bean sp\u00E9cifique qui a une limite sup\u00E9rieure stricte pour les instances de bean
strict-max-bean-instance-pool.name=Le nom du pool
strict-max-bean-instance-pool.max-pool-size=Le nombre maximum d'instances de bean configur\u00E9s que le pool peut contenir \u00E0 un moment donn\u00E9
strict-max-bean-instance-pool.derived-size=Le nombre maximum d'instances de bean d\u00E9riv\u00E9s que le pool peut contenir \u00E0 un moment donn\u00E9
strict-max-bean-instance-pool.derive-size=Sp\u00E9cifie et indique d\u2019o\u00F9 la taille de pool maximale doit venir. Une valeur non d\u00E9finie (ou la valeur \u00AB\u00A0none\u00A0\u00BB converite \u00E0 non d\u00E9finie) indique que la valeur explicite de taille de pool maximale doit \u00EAtre utilis\u00E9e. La valeur 'from-worker-pools' indique que la taille de pool maximale doit \u00EAtre d\u00E9riv\u00E9e de la taille totale de tous les threads de tous les pools de worker configur\u00E9s sur le syst\u00E8me. La valeur 'from-cpu-count' indique que la taille de pool maximale devrait \u00EAtre d\u00E9riv\u00E9e du nombre total de processeurs disponibles sur le syst\u00E8me. Notez que le calcul n'est pas un mappage 1:1 ; les valeurs peuvent ou ne peuvent pas \u00EAtre augment\u00E9es par d'autres facteurs.
strict-max-bean-instance-pool.timeout=La dur\u00E9e maximum \u00E0 attendre pour qu'une instance de bean puisse \u00EAtre disponible en provenance du pool
strict-max-bean-instance-pool.timeout-unit=L'unit\u00E9 de d\u00E9lai d'attente d'acquisition d'instance

deployed=Ressources d'ex\u00E9cution expos\u00E9es par les composants Jakarta Enterprise Beans inclus dans ce d\u00E9ploiement.

entity-bean=Composant d'entit\u00E9 bean inclus dans le d\u00E9ploiement.
entity-bean.component-class-name=Le nom de la classe du composant.
entity-bean.security-domain=Le domaine de s\u00E9curit\u00E9 pour ce composant Jakarta Enterprise Beans.
entity-bean.run-as-role=Le r\u00F4le d'ex\u00E9cution (le cas \u00E9ch\u00E9ant) pour ce composant Jakarta Enterprise Beans.
entity-bean.declared-roles=Les r\u00F4les d\u00E9clar\u00E9s (via @DeclareRoles) sur ce composant Jakarta Enterprise Beans.
entity-bean.execution-time=Temps pass\u00E9 dans une m\u00E9thode bean.
entity-bean.invocations=Le nombre d'invocations trait\u00E9es.
entity-bean.methods=M\u00E9triques d'invocation par m\u00E9thode.
entity-bean.methods.execution-time=Temps pass\u00E9 dans cette m\u00E9thode bean.
entity-bean.methods.invocations=Le nombre d'invocations trait\u00E9es.
entity-bean.methods.wait-time=Dur\u00E9e d'attente pour l'obtention d'une instance.
entity-bean.peak-concurrent-invocations=Appels simultan\u00E9s maximum.
entity-bean.pool-available-count=Le nombre d'instances disponibles (c-a-d non utilis\u00E9es) du pool.
entity-bean.pool-create-count=Le nombre d'instances de bean cr\u00E9\u00E9es.
entity-bean.pool-current-size=La taille actuelle du pool.
entity-bean.pool-name=Le nom du pool.
entity-bean.pool-remove-count=Le nombre d'instances qui ont \u00E9t\u00E9 supprim\u00E9es.
entity-bean.pool-max-size=La taille maximum du pool.
entity-bean.wait-time=Dur\u00E9e d'attente pour l'obtention d'une instance.

message-driven-bean=Composant de bean bas\u00E9 message inclus dans le d\u00E9ploiement.
message-driven-bean.component-class-name=Le nom de la classe du composant.
message-driven-bean.jndi-names=Les liens JNDI de la destination des messages de ce bean bas\u00E9 message.
message-driven-bean.timeout-method=La m\u00E9thode de timeout pour g\u00E9rer les minuteries cr\u00E9\u00E9es par le programme.
message-driven-bean.transaction-type=Le type de gestion des transactions du composant Jakarta Enterprise Beans (Conteneur ou Bean).
message-driven-bean.around-invoke=Les m\u00E9thodes around-invoke du composant Jakarta Enterprise Beans.
message-driven-bean.messaging-type=L'interface de l'\u00E9couteur de messages du bean bas\u00E9 message.
message-driven-bean.message-destination-type=Le type de la destination du message.
message-driven-bean.message-destination-link=Utilis\u00E9 pour lier le bean bas\u00E9 message \u00E0 une destination de message.
message-driven-bean.activation-config=Les propri\u00E9t\u00E9s de configuration attendues du bean bas\u00E9 message dans son environnement op\u00E9rationnel.
message-driven-bean.security-domain=Le domaine de s\u00E9curit\u00E9 pour ce composant Jakarta Enterprise Beans.
message-driven-bean.run-as-role=Le r\u00F4le d'ex\u00E9cution (le cas \u00E9ch\u00E9ant) pour ce composant Jakarta Enterprise Beans.
message-driven-bean.delivery-active=Indique si les messages sont d\u00E9livr\u00E9s \u00E0 ce bean message-driven.
message-driven-bean.start-delivery=D\u00E9marrer l'envoi des messages \u00E0 ce bean message-driven.
message-driven-bean.stop-delivery=Stopper l'envoi des messages \u00E0 ce bean message-driven.
message-driven-bean.declared-roles=Les r\u00F4les d\u00E9clar\u00E9s (via @DeclareRoles) sur ce composant Jakarta Enterprise Beans.
message-driven-bean.execution-time=Temps pass\u00E9 dans une m\u00E9thode bean.
message-driven-bean.invocations=Le nombre d'invocations trait\u00E9es.
message-driven-bean.methods=M\u00E9triques d'invocation par m\u00E9thode.
message-driven-bean.methods.execution-time=Temps pass\u00E9 dans cette m\u00E9thode bean.
message-driven-bean.methods.invocations=Le nombre d'invocations trait\u00E9es.
message-driven-bean.methods.wait-time=Dur\u00E9e d'attente pour l'obtention d'une instance.
message-driven-bean.peak-concurrent-invocations=Appels simultan\u00E9s maximum.
message-driven-bean.pool-available-count=Le nombre d'instances disponibles (c-a-d non utilis\u00E9es) du pool.
message-driven-bean.pool-create-count=Le nombre d'instances de bean cr\u00E9\u00E9es.
message-driven-bean.pool-current-size=La taille actuelle du pool.
message-driven-bean.pool-name=Le nom du pool.
message-driven-bean.pool-remove-count=Le nombre d'instances qui ont \u00E9t\u00E9 supprim\u00E9es.
message-driven-bean.pool-max-size=La taille maximum du pool.
message-driven-bean.timers=Minuteries Jakarta Enterprise Beans associ\u00E9es au composant.
message-driven-bean.timers.time-remaining=Le nombre de millisecondes qui passeront avant la prochaine expiration de la minuterie, ou "non d\u00E9fini" si la minuterie n'a pas de d\u00E9lais d'expiration \u00E0 venir, a expir\u00E9, ou a \u00E9t\u00E9 annul\u00E9e.
message-driven-bean.timers.next-timeout=Le moment (en ms \u00E0 partir de l'\u00E9poque) avant la prochaine expiration de la minuterie pr\u00E9vue, ou "non d\u00E9fini" si la minuterie n'a pas de d\u00E9lais d'expiration \u00E0 venir, a expir\u00E9, ou a \u00E9t\u00E9 annul\u00E9e.
message-driven-bean.timers.calendar-timer=Indique si cette minuterie est bas\u00E9e calendrier, ou "non d\u00E9fini" si la minuterie a expir\u00E9 ou a \u00E9t\u00E9 annul\u00E9e.
message-driven-bean.timers.persistent=Si le minuteur a des s\u00E9mantiques persistantes, ou "non d\u00E9fini" si le minuteur a expir\u00E9 ou a \u00E9t\u00E9 annul\u00E9.
message-driven-bean.timers.info=Information s\u00E9rialisable associ\u00E9e \u00E0 la minuterie.
message-driven-bean.timers.schedule=L'expression de programmation correspondant \u00E0 ce minuteur, ou "non d\u00E9fini" si le minuteur n'a pas \u00E9t\u00E9 cr\u00E9\u00E9 par une expression de programmation, a expir\u00E9 ou a \u00E9t\u00E9 annul\u00E9.
message-driven-bean.timers.schedule.year=Une ann\u00E9e particuli\u00E8re.
message-driven-bean.timers.schedule.month=Un ou plusieurs mois dans une ann\u00E9e.
message-driven-bean.timers.schedule.day-of-month=Un ou plusieurs jours dans un mois.
message-driven-bean.timers.schedule.day-of-week=Un ou plusieurs jours dans une semaine.
message-driven-bean.timers.schedule.hour=Une ou plusieurs heures dans un jour.
