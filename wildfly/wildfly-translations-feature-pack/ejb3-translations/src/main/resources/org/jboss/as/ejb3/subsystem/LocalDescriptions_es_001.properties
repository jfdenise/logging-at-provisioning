ejb3=La configuraci\u00F3n del sub-sistema ejb3.
ejb3.add=Agrega el sub-sistema ejb3.
ejb3.enable-statistics=Si se configura como verdadero, habilita la recopilaci\u00F3n de estad\u00EDsticas de invocaci\u00F3n. Obsoleto a favor de "statistics-enabled"
ejb3.enable-statistics.deprecated=Si se establece como \u201Ctrue\u201D, habilita la recopilaci\u00F3n de estad\u00EDsticas de invocaci\u00F3n. Obsoleto a favor de \u201Cstatistics-enabled\u201D
ejb3.statistics-enabled=Si se configura como verdadero, habilita la recopilaci\u00F3n de estad\u00EDsticas de invocaci\u00F3n.
ejb3.remove=Borra el sub-sistema ejb3.

ejb3.lite=Especifica si el contenedor ejb3 solo necesita proporcionar el perfil "LITE" de la especificaci\u00F3n. Este valor solo debe ser falso al utilizar la distribuci\u00F3n "everything".
ejb3.default-clustered-sfsb-cache=Nombre del cach\u00E9 bean con estado predeterminado, el cual se aplicar\u00E1 a todos los Jakarta Enterprise Beans con estado en el cl\u00FAster, a menos que sea sobrescrito en la implementaci\u00F3n o a nivel del bean
ejb3.default-clustered-sfsb-cache.deprecated=No recibe soporte en la versi\u00F3n actual de servidores; \u00FAnicamente est\u00E1 permitido en los perfiles de dominio administrado de los servidores que ejecutan versiones anteriores.
ejb3.default-sfsb-passivation-disabled-cache=Nombre de la cach\u00E9 bean con estado predeterminado, el cual se aplicar\u00E1 a todos los Jakarta Enterprise Beans con estado que tienen desactivada la pasivisaci\u00F3n. Cada implementaci\u00F3n o Jakarta Enterprise Beans puede sobrescribir este nombre de la cach\u00E9 de manera opcional.
ejb3.default-mdb-instance-pool=Nombre del pool de instancias MDB predeterminado, el cual se aplicar\u00E1 a todos los MDBs a menos de que sea sobrescrito en la implementaci\u00F3n o a nivel del bean
ejb3.default-entity-bean-instance-pool=Nombre del grupo de instancias de beans de entidad predeterminado, que se aplicar\u00E1 a todos los beans de entidad, a menos que se anule en el nivel de implementaci\u00F3n o de bean
ejb3.default-entity-bean-instance-pool.deprecated=No recibe soporte en la versi\u00F3n actual de servidores; \u00FAnicamente est\u00E1 permitido en los perfiles de dominio administrado de los servidores que ejecutan versiones anteriores.
ejb3.default-entity-bean-optimistic-locking=Si se establece como verdadero entonces los beans de entidad utilizar\u00E1n el bloqueo optimista por defecto
ejb3.default-entity-bean-optimistic-locking.deprecated=No recibe soporte en la versi\u00F3n actual de servidores; \u00FAnicamente est\u00E1 permitido en los perfiles de dominio administrado de los servidores que ejecutan versiones anteriores.
ejb3.default-resource-adapter-name=Nombre del adaptador de recursos predeterminado que los MDBs utilizar\u00E1n a menos de que sea sobrescrito en la implementaci\u00F3n o a nivel del bean
ejb3.default-sfsb-cache=Nombre del cach\u00E9 bean con estado predeterminado, el cual se aplicar\u00E1 a todos los Jakarta Enterprise Beans con estado, a menos que sea sobrescrito en la implementaci\u00F3n o a nivel del bean
ejb3.default-slsb-instance-pool=Nombre del pool de instancias bean sin estado predeterminado, el cual se aplicar\u00E1 a todos los Jakarta Enterprise Beans sin estado, a menos de que sea sobrescrito en la implementaci\u00F3n o a nivel del bean
ejb3.default-stateful-bean-access-timeout=El tiempo de expiraci\u00F3n de acceso predeterminado para los beans con estado
ejb3.default-stateful-bean-session-timeout=El tiempo de espera de la sesi\u00F3n por defecto para los beans con estado. La modificaci\u00F3n de este atributo surte efecto de inmediato para las implementaciones posteriores; para los Jakarta Enterprise Beans ya implementados, es necesario volver a implementarlos para utilizar el nuevo valor.
ejb3.default-singleton-bean-access-timeout=El tiempo de expiraci\u00F3n de acceso predeterminado para los beans singleton
ejb3.in-vm-remote-interface-invocation-pass-by-value=Si se establece como \u201Cfalse\u201D, entonces los par\u00E1metros para las invocaciones en la interfaz remota de Jakarta Enterprise Beans se pasar\u00E1 por referencia. De otra manera, los par\u00E1metros se pasar\u00E1n por valor.
ejb3.default-distinct-name=El nombre distintivo predeterminado que se aplica a todos los Jakarta Enterprise Beans implementados en este servidor
ejb3.default-security-domain=El dominio de seguridad predeterminado que se utilizar\u00E1 para Jakarta Enterprise Beans si el bean no especifica uno expl\u00EDcitamente
ejb3.default-missing-method-permissions-deny-access=Si se establece como \u201Ctrue\u201D, entonces, los m\u00E9todos en Jakarta Enterprise Beans con un dominio de seguridad especificado o con otros m\u00E9todos con metadatos de seguridad tendr\u00E1n un @DenyAll impl\u00EDcito, a menos que haya presentes otros metadatos de seguridad
ejb3.disable-default-ejb-permissions=Depreciado. Este atributo obsoleto no tiene efecto y ser\u00E1 eliminado en un lanzamiento futuro; nunca debe establecerse a un valor 'false'.
ejb3.disable-default-ejb-permissions.deprecated=La adici\u00F3n de permisos predeterminados a las implementaciones de Jakarta Enterprise Beans ya no se admite, y este atributo de configuraci\u00F3n ser\u00E1 eliminado en un lanzamiento futuro.
ejb3.enable-graceful-txn-shutdown=Habilitar el apagado completo txn har\u00E1 que el servidor espere que las transacciones remotas activas relacionadas con Jakarta Enterprise Beans se completen antes de suspender. Por ese motivo, si el servidor se est\u00E1 ejecutando en un cl\u00FAster, el nodo del cl\u00FAster suspendido podr\u00EDa recibir solicitudes de Jakarta Enterprise Beans hasta que se completen todas las transacciones remotas activas. Para evitar este comportamiento, omita esta etiqueta. Este atributo afecta a las transacciones locales relacionadas con Jakarta Enterprise Beans.
ejb3.log-system-exceptions=Si es \u201Ctrue\u201D, entonces todas las excepciones del sistema de Jakarta Enterprise Beans (no la aplicaci\u00F3n), ser\u00E1n registradas. La especificaci\u00F3n de Jakarta Enterprise Beans ordena esta conducta; sin embargo, no se recomienda, ya que suele ocasionar que se registren las excepciones dos veces (una vez por Jakarta Enterprise Beans y otra por el c\u00F3digo de llamada)
ejb3.allow-ejb-name-regex=Si es 'true', entonces las expresiones regulares pueden ser utilizadas en los enlaces del interceptor para ser mapeadas a los Beans que coinciden con la expresi\u00F3n regular.
ejb3.server-interceptors=Definiciones de interceptores de servidores.
ejb3.server-interceptors.class=Clase que implementa el interceptor del servidor.
ejb3.server-interceptors.module=M\u00F3dulo en el que se define el interceptor del servidor.
ejb3.client-interceptors=Definiciones de interceptores de clientes.
ejb3.client-interceptors.class=Clase que implementa el interceptor del cliente.
ejb3.client-interceptors.module=M\u00F3dulo en el que se define el interceptor del cliente.

service=Servicios configurables centralmente que forman parte del subsistema de Enterprise Beans 3.

timer-service=El servicio de temporizador de Jakarta Enterprise Beans
timer-service.add=Agrega el servicio de temporizador
timer-service.remove=Borra el servicio de temporizador
timer-service.thread-pool-name=El nombre del pool de hilos utilizado para ejecutar invocaciones de servicios del temporizador 
timer-service.default-data-store=El almac\u00E9n de datos predeterminado utilizado para temporizadores persistentes.
timer-service.default-persistent-timer-management=La gesti\u00F3n del temporizador predeterminada que se utilizar\u00E1 para los temporizadores persistentes.
timer-service.default-transient-timer-management=La gesti\u00F3n del temporizador predeterminada que se utilizar\u00E1 para los temporizadores transient.

file-data-store=Un almac\u00E9n de archivos locales de la MVJ que almacena temporizadores persistentes de Jakarta Enterprise Beans
file-data-store.add=Agrega un almac\u00E9n de datos de archivos
file-data-store.remove=Borra un almac\u00E9n de datos de archivos
file-data-store.path=El directorio para almacenar informaci\u00F3n del temporizador persistente en
file-data-store.relative-to=La ruta relativa que se utiliza para resolver la ubicaci\u00F3n del almac\u00E9n de datos del temporizador


database-data-store=Un almac\u00E9n dentro de la base de datos para los temporizadores persistentes de Jakarta Enterprise Beans.
database-data-store.add=Agrega un almac\u00E9n de la base de datos
database-data-store.remove=Borra un almac\u00E9n de la base de datos
database-data-store.datasource-jndi-name=La fuente de datos que se utiliza para persistir los temporizadores
database-data-store.database=El tipo de base de datos en uso. SQL se puede personalizar seg\u00FAn el tipo de base de datos. Los valores comunes son los siguientes: postgresql, mysql, mariadb, db2, hsql, h2, oracle, mssql y sybase.
database-data-store.partition=El nombre de la partici\u00F3n. Esto se debe establecer con un valor diferente para todo nodo que est\u00E9 compartiendo una base de datos para prevenir que el mismo temporizador sea cargado por m\u00FAltiples nodos.
database-data-store.refresh-interval=El intervalo entre la actualizaci\u00F3n del temporizador actual frente a la base de datos subyacente. Un valor bajo significa que los temporizadores se reconocen m\u00E1s r\u00E1pidamente pero hay una mayor carga en la base de datos.
database-data-store.allow-execution=Si se le permite a este nodo el ejecutar temporizadores. Si este es falso entonces los temporizadores se agregar\u00E1n a la base de datos y otro nodo puede ejecutarlos. Note que dependiendo de su intervalo de actualizaci\u00F3n si agrega temporizadores con un retraso muy corto entonces no se ejecutar\u00E1n hasta que otro nodo se actualice.

timer=Temporizador real en marcha para Jakarta Enterprise Beans
timer.info=Informaci\u00F3n serializable asociada con el temporizador.
timer.primary-key=Llave primaria de la instancia de Jakarta Enterprise Beans que inici\u00F3 el temporizador.
timer.primary-key.deprecated=Obsoleto porque ya no se admiten los beans de entidad.
timer.time-remaining=El n\u00FAmero de milisegundos que transcurrir\u00E1n antes de la siguiente expiraci\u00F3n programada del temporizador o "indefinido" si el temporizador no tiene limites de tiempo futuros o se ha cancelado.
timer.next-timeout=El punto en el tiempo (en ms desde la \u00E9poca) en el que se encuentra programada la siguiente expiraci\u00F3n del temporizador o "indefinido" si el temporizador no tiene l\u00EDmites de tiempo futuros, ha expirado o se ha cancelado.
timer.calendar-timer=Si este temporizador es un temporizador basado en calendario o "indefinido" si el temporizador ha expirado o se ha cancelado.
timer.persistent=Si este temporizador tiene una sem\u00E1ntica persistente o "indefinida" si el temporizador ha expirado o se ha cancelado.
timer.active=Indica si este temporizador est\u00E1 activo o suspendido.
timer.schedule=La expresi\u00F3n programada que corresponde a este temporizador o "indefinido" si el temporizador no se cre\u00F3 utilizando una expresi\u00F3n programada, ha expirado o se ha cancelado.
timer.schedule.year=Un a\u00F1o calendario en particular.
timer.schedule.month=Uno o m\u00E1s meses dentro de un a\u00F1o.
timer.schedule.day-of-month=Uno o m\u00E1s d\u00EDas dentro de un mes.
timer.schedule.day-of-week=Uno o m\u00E1s d\u00EDas dentro de una semana.
timer.schedule.hour=Una o m\u00E1s horas dentro de un d\u00EDa.
timer.schedule.minute=Uno o m\u00E1s minutos dentro de una hora.
timer.schedule.second=Uno o m\u00E1s segundos dentro de un minuto.
timer.schedule.timezone=Una zona horaria no predeterminada en cuyo contexto la especificaci\u00F3n del programa se eval\u00FAa.
timer.schedule.start=La fecha de inicio para el temporizador en ms desde la \u00E9poca.
timer.schedule.end=La fecha final para el temporizador en ms desde la \u00E9poca.

timer.suspend=Suspende el temporizador. No habr\u00E1 l\u00EDmite de tiempo despu\u00E9s de que se haya invocado esta operaci\u00F3n. Para reanimar el temporizador est\u00E1 presente la operaci\u00F3n 'activate'.
timer.activate=Activa el temporizador despu\u00E9s de que se ha suspendido.
timer.cancel=Cancela el temporizador y lo borra del contenedor.
timer.trigger=Dispara el l\u00EDmite de tiempo del temporizador de manera prematura.

strict-max-bean-instance-pool=Un pool de instancias bean con un l\u00EDmite superior estricto
strict-max-bean-instance-pool.add=Agrega un pool de instancias bean, el cual tiene un l\u00EDmite superior estricto para las instancias de bean
strict-max-bean-instance-pool.remove=Borra un grupo de instancias bean espec\u00EDfico, el cual tiene un l\u00EDmite superior estricto para las instancias de bean
strict-max-bean-instance-pool.name=El nombre del pool
strict-max-bean-instance-pool.max-pool-size=N\u00FAmero m\u00E1ximo configurado de instancias de bean que el grupo puede mantener en un momento dado
strict-max-bean-instance-pool.derived-size=N\u00FAmero m\u00E1ximo derivado de instancias de bean que el grupo puede mantener en un momento dado
strict-max-bean-instance-pool.derive-size=Especifica si y de qu\u00E9 tama\u00F1o m\u00E1ximo de grupo se debe derivar. Un valor no definido (o el valor obsoleto 'none' que se convierte en no definido) indica que se debe usar el valor expl\u00EDcito de max-pool-size. Un valor de 'from-worker-pools' indica que el tama\u00F1o m\u00E1ximo de grupo debe derivar del tama\u00F1o de los hilos totales para todos los grupos de trabajador configurados en el sistema. Un valor de 'from-cpu-count' indica que el tama\u00F1o m\u00E1ximo de grupo debe derivar de la cantidad total de procesadores disponibles en el sistema. Tenga en cuenta que el c\u00E1lculo no es un mapeo 1:1; los valores pueden estar aumentados o no por otros factores.
strict-max-bean-instance-pool.timeout=La cantidad m\u00E1xima de tiempo a esperar para que una instancia bean est\u00E9 disponible en el pool
strict-max-bean-instance-pool.timeout-unit=La unidad del tiempo de expiraci\u00F3n de adquisici\u00F3n de la instancia

deployed=Recursos del tiempo de ejecuci\u00F3n expuestos por los componentes Jakarta Enterprise Beans incluidos en esta implementaci\u00F3n.

