ejb3=A configura\u00E7\u00E3o do subsistema ebj3.
ejb3.add=Adiciona o subsistema ejb3.
ejb3.enable-statistics=Se definido como verdadeiro, ativa a coleta de estat\u00EDsticas de invoca\u00E7\u00E3o. Preterido em favor de "statistics-enabled"
ejb3.enable-statistics.deprecated=Se definido como verdadeiro, ativa a coleta de estat\u00EDsticas de invoca\u00E7\u00E3o. Preterido em favor de "statistics-enabled"
ejb3.statistics-enabled=Se definido como verdadeiro, ativa a coleta de estat\u00EDsticas de invoca\u00E7\u00E3o.
ejb3.remove=Removes o subsistema ejb3.

ejb3.lite=Especifica se \u00E9 que o recipiente ejb3 precisa apenas fornecer o perfil "LITE" da especifica\u00E7\u00E3o. O valor deve ser apenas falso quando usando "tudo" do distro. 
ejb3.default-clustered-sfsb-cache=O nome do cache do bean de estado padr\u00E3o, que ser\u00E1 aplic\u00E1vel a todos os Jakarta Enterprise Beans com estado e com cluster, a n\u00E3o ser que sobrepostos na implanta\u00E7\u00E3o ou ao n\u00EDvel do bean
ejb3.default-clustered-sfsb-cache.deprecated=N\u00E3o recebe suporte na vers\u00E3o atual de servidores; permitido somente em perfis de dom\u00EDnio gerenciado para utiliza\u00E7\u00E3o dos servidores que executam vers\u00F5es anteriores. 
ejb3.default-sfsb-passivation-disabled-cache=Nome do cache de bean de estado padr\u00E3o, que ser\u00E1 aplic\u00E1vel a todos os estados de Jakarta Enterprise Beans que tenham a passiva\u00E7\u00E3o desativada. Cada implanta\u00E7\u00E3o ou Jakarta Enterprise Beans pode opcionalmente sobrepor este nome de cache.
ejb3.default-mdb-instance-pool=O nome do pool da inst\u00E2ncia MDB default, que ser\u00E1 aplicado a todos os MDBs, a n\u00E3o que substitu\u00EDdos na implanta\u00E7\u00E3o ou ao n\u00EDvel do bean
ejb3.default-entity-bean-instance-pool=O nome do pool da inst\u00E2ncia do bean de entidade default, que ser\u00E1 aplicado a todos os MDBs, a n\u00E3o que substitu\u00EDdos na implanta\u00E7\u00E3o ou ao n\u00EDvel do bean
ejb3.default-entity-bean-instance-pool.deprecated=N\u00E3o recebe suporte na vers\u00E3o atual de servidores; permitido somente em perfis de dom\u00EDnio gerenciado para utiliza\u00E7\u00E3o dos servidores que executam vers\u00F5es anteriores.
ejb3.default-entity-bean-optimistic-locking=Os beans usar\u00E3o o boqueamento otimista por default, caso configurados para verdadeiro
ejb3.default-entity-bean-optimistic-locking.deprecated=N\u00E3o recebe suporte na vers\u00E3o atual de servidores; permitido somente em perfis de dom\u00EDnio gerenciado para utiliza\u00E7\u00E3o dos servidores que executam vers\u00F5es anteriores.
ejb3.default-resource-adapter-name=O nome do adaptador de recurso default que ser\u00E1 usado pelos MDBs, a n\u00E3o ser que substitu\u00EDdos na implanta\u00E7\u00E3o ou n\u00EDvel do bean
ejb3.default-sfsb-cache=O nome do cache do bean de estado padr\u00E3o, que ser\u00E1 aplicado a todos os Jakarta Enterprise Beans com estado, a n\u00E3o ser que sobrepostos na implanta\u00E7\u00E3o ou n\u00EDvel do bean
ejb3.default-slsb-instance-pool=O nome do pool da inst\u00E2ncia do bean sem estado padr\u00E3o, que ser\u00E1 aplic\u00E1vel a todos os Jakarta Enterprise Beans sem estado, a n\u00E3o ser que substitu\u00EDdos na implanta\u00E7\u00E3o ou n\u00EDvel do bean
ejb3.default-stateful-bean-access-timeout=O intervalo de acesso default para os beans com estado
ejb3.default-stateful-bean-session-timeout=O limite de tempo padr\u00E3o da sess\u00E3o para beans com estado. A modifica\u00E7\u00E3o deste atributo entra em vigor imediatamente para implanta\u00E7\u00F5es subsequentes; para Jakarta Enterprise Beans j\u00E1 implantado, \u00E9 necess\u00E1ria uma reimplanta\u00E7\u00E3o para utilizar o novo valor.
ejb3.default-singleton-bean-access-timeout=O intervalo de acesso default para os beans singleton
ejb3.in-vm-remote-interface-invocation-pass-by-value=Caso falso, os par\u00E2metros para invoca\u00E7\u00F5es na interface remota de um Jakarta Enterprise Beans, ser\u00E3o passados pela refer\u00EAncia. Do contr\u00E1rio, os par\u00E2metros ser\u00E3o passados pelo valor.
ejb3.default-distinct-name=O nome distinto padr\u00E3o que \u00E9 aplicado a cada Jakarta Enterprise Beans implantado neste servidor
ejb3.default-security-domain=O dom\u00EDnio de seguran\u00E7a padr\u00E3o que ser\u00E1 usado para o Jakarta Enterprise Beans caso o bean n\u00E3o especifique um dom\u00EDnio de forma clara
ejb3.default-missing-method-permissions-deny-access=Caso for configurado para verdadeiro, os m\u00E9todos em um Jakarta Enterprise Beans com dom\u00EDnio de seguran\u00E7a especificado ou com outros m\u00E9todos com metadados de seguran\u00E7a n\u00E3o ter\u00E3o um @DenyAll impl\u00EDcito a n\u00E3o ser que o metadado de seguran\u00E7a esteja presente
ejb3.disable-default-ejb-permissions=Este atributo preterido n\u00E3o tem efeito e ser\u00E1 removido em um lan\u00E7amento futuro; nunca deve ser definido para um valor "false" 
ejb3.disable-default-ejb-permissions.deprecated=A adi\u00E7\u00E3o de permiss\u00F5es predeterminadas \u00E0 implementa\u00E7\u00F5es Jakarta Enterprise Beans n\u00E3o recebe mais suporte e este atributo de configura\u00E7\u00E3o ser\u00E1 removido em um lan\u00E7amento futuro
ejb3.enable-graceful-txn-shutdown=Habilitar o desligamento normal txn far\u00E1 o servidor aguardar a conclus\u00E3o das transa\u00E7\u00F5es remotas ativas relacionadas ao Jakarta Enterprise Beans antes de ser suspenso. Por esse motivo, se o servidor estiver sendo executado em um cluster, o n\u00F3 do cluster em suspens\u00E3o poder\u00E1 receber solicita\u00E7\u00F5es do Jakarta Enterprise Beans at\u00E9 que todas as transa\u00E7\u00F5es remotas ativas sejam conclu\u00EDdas. Para evitar esse comportamento, omita essa tag. Esse atributo n\u00E3o tem efeito sobre as transa\u00E7\u00F5es locais relacionadas ao Jakarta Enterprise Beans.
ejb3.log-system-exceptions=Se isto for verdade, todas as exce\u00E7\u00F5es (n\u00E3o de aplicativos) do sistema de Jakarta Enterprise Beans ser\u00E3o registradas. As especifica\u00E7\u00F5es do Jakarta Enterprise Beans exigem este comportamento, por\u00E9m ele n\u00E3o \u00E9 recomendado, pois muitas vezes resultar\u00E1 em exce\u00E7\u00F5es que ser\u00E3o registradas duas vezes (uma pelo Jakarta Enterprise Beans e outra pelo c\u00F3digo de chamada)
ejb3.allow-ejb-name-regex=Se isto for verdadeiro, ent\u00E3o express\u00F5es regulares podem ser utilizadas em associa\u00E7\u00F5es de interceptores para permitir que interceptores sejam mapeados a todos os beans que correspondam com a express\u00E3o regular. 
ejb3.server-interceptors=Defini\u00E7\u00F5es do interceptor do servidor.
ejb3.server-interceptors.class=Classe que implementa o interceptor do servidor.
ejb3.server-interceptors.module=M\u00F3dulo no qual se define o interceptor do servidor est\u00E1 definido.
ejb3.client-interceptors=Defini\u00E7\u00F5es de interceptor do cliente.
ejb3.client-interceptors.class=Classe que implementa o interceptor do cliente.
ejb3.client-interceptors.module=M\u00F3dulo no qual se define o interceptor do cliente est\u00E1 definido.

service=Servi\u00E7os centralmente configur\u00E1veis que fazem parte do subsistema Enterprise Beans 3.

timer-service=O servi\u00E7o de temporizador de Jakarta Enterprise Beans
timer-service.add=Adiciona o servi\u00E7o do timer
timer-service.remove=Remove o servi\u00E7o do timer
timer-service.thread-pool-name=O nome do pool do thread usado para rodar as invoca\u00E7\u00F5es do servi\u00E7o do timer
timer-service.default-data-store=O store de dados default usado para timers persistentes
timer-service.default-persistent-timer-management=O gerenciamento de temporizadores padr\u00E3o a ser usado para temporizadores persistentes.
timer-service.default-transient-timer-management=O gerenciamento de temporizadores padr\u00E3o a ser usado para temporizadores transit\u00F3rios.

file-data-store=Uma loja de arquivos local da JVM que armazena os temporizadores persistentes de Jakarta Enterprise Beans
file-data-store.add=Adiciona o store de dados do arquivo
file-data-store.remove="Remove um store de dados do arquivo
file-data-store.path=O diret\u00F3rio para store a informa\u00E7\u00E3o timer persistente
file-data-store.relative-to=O caminho relativo que \u00E9 usado para resolver a localiza\u00E7\u00E3o do store de dados do timer


database-data-store=Um armazenamento baseado em banco de dados para os temporizadores persistentes de Jakarta Enterprise Beans.
database-data-store.add=Adiciona um store do banco de dados
database-data-store.remove=Remove um store do banco de dados
database-data-store.datasource-jndi-name=A fonte de dados que \u00E9 usada para persistir os timers
database-data-store.database=O tipo de banco de dados que est\u00E1 em uso. O SQL pode ser personalizado por tipo de banco de dados. Os valores comuns s\u00E3o: postgresql, mysql, mariadb, db2, hsql, h2, oracle, mssql e sybase.
database-data-store.partition=O nome da parti\u00E7\u00E3o. Isto deve ser determinado a um valor diferente para cada n\u00F3 que est\u00E1 compartilhando um banco de dados para prevenir o mesmo timer sendo carregado por n\u00F3s m\u00FAltiplos.
database-data-store.refresh-interval=O intervalo entre o timer atual determinado em rela\u00E7\u00E3o ao banco de dados subjacente. Um valor inferior significa que os timers s\u00E3o obtidos mais rapidamente, por\u00E9m isto aumenta a carga no banco de dados.
database-data-store.allow-execution=Caso este n\u00F3 seja permitido para executar timers. Caso isto seja falso, os timers ser\u00E3o adicionados ao banco de dados e outro n\u00F3 poder\u00E1 execut\u00E1-los. Perceba que dependendo de seu intervalo de atualiza\u00E7\u00E3o, caso voc\u00EA adicione timers com um pequeno atraso, eles n\u00E3o ser\u00E3o executados at\u00E9 que outro n\u00F3 seja atualizado.

timer=Temporizador real funcionando para Jakarta Enterprise Beans
timer.info=A informa\u00E7\u00E3o serializada associada com o timer.
timer.primary-key=Chave prim\u00E1ria da inst\u00E2ncia de Jakarta Enterprise Beans que iniciou o temporizador.
timer.primary-key.deprecated=Depreciado, j\u00E1 que os beans de entidade n\u00E3o s\u00E3o mais compat\u00EDveis.
timer.time-remaining=O n\u00FAmero de mil\u00E9simos de segundos que ir\u00E1 transcorrer antes da pr\u00F3xima expira\u00E7\u00E3o de timer esquematizada ou 'indefinido' caso o timer n\u00E3o possua intervalos futuros, estiver expirado ou cancelado.
timer.next-timeout=O per\u00EDodo no tempo (em mil\u00E9simos de segundos desde a \u00E9poca) pelo qual a pr\u00F3xima expira\u00E7\u00E3o do timer est\u00E1 esquematizada para ocorrer ou "indefinido" caso o timer n\u00E3o possua intervalos futuros, estiver expirado ou cancelado.
timer.calendar-timer=Se \u00E9 que este timer \u00E9 um timer baseado no calend\u00E1rio, ou "indefinido" caso o timer estiver expirado ou cancelado.
timer.persistent=Se \u00E9 que este timer possui sem\u00E2nticas persistentes ou \u00E9 "indefinido" caso o timer estiver expirado ou cancelado.
timer.active=Indica se \u00E9 que este timer est\u00E1 ativo ou suspenso.
timer.schedule=A express\u00E3o esquematizada correspondente a este timer ou "indefinido" caso o timer n\u00E3o foi criado usando uma express\u00E3o esquematizada, estiver expirado ou cancelado.
timer.schedule.year=Um ano de calend\u00E1rio particular.
timer.schedule.month=Um ou mais meses no ano.
timer.schedule.day-of-month=Um ou mais dias no m\u00EAs.
timer.schedule.day-of-week=Um ou mais dias numa semana.
timer.schedule.hour=Uma ou mais horas num dia.
timer.schedule.minute=Um ou mais minutos numa hora.
timer.schedule.second=Um ou mais segundos num minuto.
timer.schedule.timezone=O fuso hor\u00E1rio que n\u00E3o \u00E9 default cujo contexto de especifica\u00E7\u00E3o esquematizada est\u00E1 para ser avaliado.
timer.schedule.start=A data de in\u00EDcio para o timer, em mil\u00E9simos de segundos desde a \u00E9poca.
timer.schedule.end=A data final para o timer, em mil\u00E9simos de segundos desde a \u00E9poca.

timer.suspend=Suspende o timer. Nenhum intervalo ir\u00E1 ocorrer ap\u00F3s esta opera\u00E7\u00E3o ser invocada. Para reanimar o timer, a opera\u00E7\u00E3o 'ativar' est\u00E1 presente.
timer.activate=Ativa o timer ap\u00F3s ele ser suspenso.
timer.cancel=Cancela o timer e o remove do cont\u00EAiner.
timer.trigger=Efetua o trigger no m\u00E9todo de intervalo do timer prematuramente.

strict-max-bean-instance-pool=O pool da inst\u00E2ncia do bean com um limite super estrito
strict-max-bean-instance-pool.add=Adiciona o pool da inst\u00E2ncia do bean que possui um limite super estrito para as inst\u00E2ncias do bean
strict-max-bean-instance-pool.remove=Remove um pool da inst\u00E2ncia do bean espec\u00EDfico que possui um limite super estrito para as inst\u00E2ncias do bean
strict-max-bean-instance-pool.name=Nome do pool
strict-max-bean-instance-pool.max-pool-size=O n\u00FAmero m\u00E1ximo de inst\u00E2ncias de bean configuradas que o pool pode manter num per\u00EDodo de tempo determinado
strict-max-bean-instance-pool.derived-size=O n\u00FAmero m\u00E1ximo de inst\u00E2ncias de bean derivadas que o pool pode manter num per\u00EDodo de tempo determinado
strict-max-bean-instance-pool.derive-size=Especifica se o tamanho m\u00E1ximo do pool deve ser derivado e a partir do qu\u00EA. Um valor indefinido (ou o valor preterido "none" que \u00E9 convertido para indefinido) indica que o valor expl\u00EDcito de max-pool-size deve ser usado. Um valor de "from-worker-pools" indica que o tamanho m\u00E1ximo do pool deve ser derivado do tamanho de threads totais para todos os pools de trabalho configurados no sistema. Um valor de "from-cpu-count" indica que o tamanho m\u00E1ximo do pool deve ser derivado do n\u00FAmero total de processadores dispon\u00EDveis no sistema. Observe que a computa\u00E7\u00E3o n\u00E3o \u00E9 um mapeamento 1:1. Os valores podem ou n\u00E3o ser aumentados por outros fatores.
strict-max-bean-instance-pool.timeout=O per\u00EDodo m\u00E1ximo de tempo de espera para uma inst\u00E2ncia de bean a ser disponibilizada a partir do pool
strict-max-bean-instance-pool.timeout-unit=A unidade do intervalo de aquisi\u00E7\u00E3o da inst\u00E2ncia

deployed=Recursos de tempo de execu\u00E7\u00E3o expostos pelos componentes do Jakarta Enterprise Beans inclu\u00EDdos nesta implanta\u00E7\u00E3o.

entity-bean=O componente do bean de entidade inclu\u00EDdo na implanta\u00E7\u00E3o.
entity-bean.component-class-name=O nome da classe do componente.
entity-bean.security-domain=O dom\u00EDnio de seguran\u00E7a para este componente de Jakarta Enterprise Beans.
entity-bean.run-as-role=Executar-como a fun\u00E7\u00E3o (se houver) para este componente de Jakarta Enterprise Beans.
entity-bean.declared-roles=As fun\u00E7\u00F5es declaradas (via @DeclareRoles) neste componente de Jakarta Enterprise Beans.
entity-bean.execution-time=Tempo utilizado com o m\u00E9todo do bean.
entity-bean.invocations=O n\u00FAmero de invoca\u00E7\u00F5es processadas.
entity-bean.methods=M\u00E9tricas de invoca\u00E7\u00E3o por m\u00E9todo.
entity-bean.methods.execution-time=Tempo utilizado com este m\u00E9todo bean.
entity-bean.methods.invocations=O n\u00FAmero de invoca\u00E7\u00F5es processadas.
entity-bean.methods.wait-time=O per\u00EDodo de espera para obten\u00E7\u00E3o de uma inst\u00E2ncia.
entity-bean.peak-concurrent-invocations=As invoca\u00E7\u00F5es atuais de pico.
entity-bean.pool-available-count=O n\u00FAmero de inst\u00E2ncias das vari\u00E1veis (ex.: que n\u00E3o est\u00E3o em uso) no pool.
entity-bean.pool-create-count=O n\u00FAmero das inst\u00E2ncias do bean que foram criadas.
entity-bean.pool-current-size=O tamanho atual do pool.
entity-bean.pool-name=O nome do pool.
entity-bean.pool-remove-count=O n\u00FAmero de inst\u00E2ncias de bean que foram removidas.
entity-bean.pool-max-size=O tamanho m\u00E1ximo de pool.
entity-bean.wait-time=O per\u00EDodo de espera para obten\u00E7\u00E3o de uma inst\u00E2ncia.

message-driven-bean=O componente de bean dirigido de mensagem na implanta\u00E7\u00E3o.
message-driven-bean.component-class-name=O nome da classe do componente.
message-driven-bean.jndi-names=Os v\u00EDnculos JNDI de destino desta mensagem controlada por bean 
message-driven-bean.timeout-method=O m\u00E9todo de tempo limite para processar programaticamente temporizadores criados .
message-driven-bean.transaction-type=O tipo de gest\u00E3o de transa\u00E7\u00F5es do componente de Jakarta Enterprise Beans (Cont\u00EAiner ou Bean).
message-driven-bean.around-invoke=Os m\u00E9todos around-invoke do componente Jakarta Enterprise Beans.
message-driven-bean.messaging-type=A interface de escuta de mensagens do bean controlado por mensagem.
message-driven-bean.message-destination-type=O tipo de destino da mensagem.
message-driven-bean.message-destination-link=Usado para vincular o bean controlado por mensagem a um destino de mensagem.
message-driven-bean.activation-config=As propriedades de configura\u00E7\u00E3o esperadas do bean controlado por mensagem em seu ambiente operacional.
message-driven-bean.security-domain=O dom\u00EDnio de seguran\u00E7a para este componente de Jakarta Enterprise Beans.
message-driven-bean.run-as-role=Executar-como a fun\u00E7\u00E3o (se houver) para este componente de Jakarta Enterprise Beans.
message-driven-bean.delivery-active=Indica se as mensagens s\u00E3o entregues a este message-driven bean.
message-driven-bean.start-delivery=Iniciar a entrega de mensages a este message-driven bean.
message-driven-bean.stop-delivery=Encerrar as mensagens a este message-driven bean.
message-driven-bean.declared-roles=As fun\u00E7\u00F5es declaradas (via @DeclareRoles) neste componente de Jakarta Enterprise Beans.
message-driven-bean.execution-time=Tempo utilizado com o m\u00E9todo do bean.
message-driven-bean.invocations=O n\u00FAmero de invoca\u00E7\u00F5es processadas.
message-driven-bean.methods=M\u00E9tricas de invoca\u00E7\u00E3o por m\u00E9todo.
message-driven-bean.methods.execution-time=Tempo utilizado com este m\u00E9todo bean.
message-driven-bean.methods.invocations=O n\u00FAmero de invoca\u00E7\u00F5es processadas.
message-driven-bean.methods.wait-time=O per\u00EDodo de espera para obten\u00E7\u00E3o de uma inst\u00E2ncia.
message-driven-bean.peak-concurrent-invocations=As invoca\u00E7\u00F5es atuais de pico.
message-driven-bean.pool-available-count=O n\u00FAmero de inst\u00E2ncias das vari\u00E1veis (ex.: que n\u00E3o est\u00E3o em uso) no pool.
message-driven-bean.pool-create-count=O n\u00FAmero das inst\u00E2ncias do bean que foram criadas.
message-driven-bean.pool-current-size=O tamanho atual do pool.
message-driven-bean.pool-name=O nome do pool.
message-driven-bean.pool-remove-count=O n\u00FAmero de inst\u00E2ncias de bean que foram removidas.
message-driven-bean.pool-max-size=O tamanho m\u00E1ximo de pool.
message-driven-bean.timers=Temporizadores de Jakarta Enterprise Beans associados ao componente.
message-driven-bean.timers.time-remaining=O n\u00FAmero de mil\u00E9simos de segundos que ir\u00E1 transcorrer antes da pr\u00F3xima expira\u00E7\u00E3o de timer esquematizada ou 'indefinido' caso o timer n\u00E3o possua intervalos futuros, estiver expirado ou cancelado.
message-driven-bean.timers.next-timeout=O per\u00EDodo no tempo (em mil\u00E9simos de segundos desde a \u00E9poca) pelo qual a pr\u00F3xima expira\u00E7\u00E3o do timer est\u00E1 esquematizada para ocorrer ou "indefinido" caso o timer n\u00E3o possua intervalos futuros, estiver expirado ou cancelado.
message-driven-bean.timers.calendar-timer=Se \u00E9 que este timer \u00E9 um timer baseado no calend\u00E1rio, ou "indefinido" caso o timer estiver expirado ou cancelado.
message-driven-bean.timers.persistent=Se \u00E9 que esse timer possui sem\u00E2nticas persistentes, ou \u00E9 "indefinido" caso o timer tenha expirado ou tenha sido cancelado.
message-driven-bean.timers.info=A informa\u00E7\u00E3o serializada associada com o timer.
message-driven-bean.timers.schedule=A express\u00E3o correspondente a esse timer, ou \u00E9 "indefinido" caso o timer n\u00E3o tenha sido criado usando uma express\u00E3o, tenha expirado ou tenha sido cancelado.
message-driven-bean.timers.schedule.year=Um ano de calend\u00E1rio particular.
message-driven-bean.timers.schedule.month=Um ou mais meses no ano.
message-driven-bean.timers.schedule.day-of-month=Um ou mais dias no m\u00EAs.
message-driven-bean.timers.schedule.day-of-week=Um ou mais dias numa semana.
message-driven-bean.timers.schedule.hour=Uma ou mais horas num dia.
message-driven-bean.timers.schedule.minute=Um ou mais minutos numa hora.
message-driven-bean.timers.schedule.second=Um ou mais segundos num minuto.
message-driven-bean.timers.schedule.timezone=O fuso hor\u00E1rio que n\u00E3o \u00E9 default cujo contexto de especifica\u00E7\u00E3o esquematizada est\u00E1 para ser avaliado.
message-driven-bean.timers.schedule.start=A data de in\u00EDcio para o timer, em mil\u00E9simos de segundos desde a \u00E9poca.
message-driven-bean.timers.schedule.end=A data final para o timer, em mil\u00E9simos de segundos desde a \u00E9poca.
