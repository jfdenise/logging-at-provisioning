# French translations for AppLogger
# File name pattern: <SimpleName>.i18n_<locale>.properties
# Translation key = method name (no overloading here, so just the method name).
# The APT processor and the provisioning-time runner both use these files to
# generate AppLogger_$logger_fr.class (a subclass that overrides the $str helpers).

serverStarted=Serveur démarré (version %s)
serverStopped=Serveur arrêté
unexpectedError=Erreur inattendue lors du traitement
serviceFailedToStart=Le service '%s' n'a pas pu démarrer
