# French translations for AppMessages
# File name pattern: <SimpleName>.i18n_<locale>.properties
# Translation key = method name.
# The APT processor and the provisioning-time runner both use these files to
# generate AppMessages_$bundle_fr.class (a subclass that overrides the $str helpers).

argumentMustNotBeNull=L'argument '%s' ne doit pas \u00eatre null
resourceNotFound=Ressource introuvable : %s
connectionFailed=\u00c9chec de la connexion \u00e0 l'h\u00f4te '%s'
operationTimedOut=L'op\u00e9ration '%s' a expir\u00e9 apr\u00e8s %d ms
